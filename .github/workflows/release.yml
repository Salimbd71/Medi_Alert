name: Medi Alert Release CI/CD

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version (e.g. 1.0.0). Leave empty to auto-increment patch version."
        required: false
        default: ""
        type: string
      run_tests:
        description: "Run unit & Robolectric tests before building"
        required: false
        default: true
        type: boolean
      build_debug_apk:
        description: "Build Debug APK"
        required: false
        default: false
        type: boolean
      build_release_apk:
        description: "Build Signed Release APK"
        required: false
        default: true
        type: boolean
      build_release_aab:
        description: "Build Signed Release AAB"
        required: false
        default: true
        type: boolean
      publish_release:
        description: "Create Git tag and publish GitHub Release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Test & Release Medi Alert
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve & validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          INPUT_VER="${{ inputs.version }}"
          INPUT_VER="${INPUT_VER#v}"
          INPUT_VER="$(echo "$INPUT_VER" | xargs)"

          if [ -z "$INPUT_VER" ]; then
            LATEST_TAG="$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)"
            if [ -z "$LATEST_TAG" ]; then
              RESOLVED="1.0.0"
            else
              BASE="${LATEST_TAG#v}"
              CORE="${BASE%%-*}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$CORE"
              MAJOR="${MAJOR:-1}"
              MINOR="${MINOR:-0}"
              PATCH="${PATCH:-0}"
              RESOLVED="${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
          else
            RESOLVED="$INPUT_VER"
          fi

          if ! [[ "$RESOLVED" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid semantic version '$RESOLVED'. Expected format like 1.0.0 or 1.2.3-beta.1"
            exit 1
          fi

          TAG="v${RESOLVED}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Git tag '${TAG}' already exists. Please choose a new version."
            exit 1
          fi

          CORE="${RESOLVED%%-*}"
          IFS='.' read -r MAJ MIN PAT <<< "$CORE"
          VERSION_CODE=$((MAJ * 10000 + MIN * 100 + PAT))
          if [ "$VERSION_CODE" -lt 1 ]; then
            VERSION_CODE=1
          fi

          echo "version=${RESOLVED}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${RESOLVED}, tag=${TAG}, versionCode=${VERSION_CODE}"

      - name: Validate release signing secrets
        if: ${{ inputs.build_release_apk || inputs.build_release_aab }}
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          MISSING=0
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Missing secret ANDROID_KEYSTORE_BASE64"
            MISSING=1
          fi
          if [ -z "$STORE_PASS" ]; then
            echo "::error::Missing secret ANDROID_STORE_PASSWORD"
            MISSING=1
          fi
          if [ -z "$KEY_PASS" ]; then
            echo "::error::Missing secret ANDROID_KEY_PASSWORD"
            MISSING=1
          fi
          if [ "$MISSING" -ne 0 ]; then
            echo "::error::Configure all required signing secrets in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle & cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare signing keystore
        if: ${{ inputs.build_release_apk || inputs.build_release_aab }}
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | tr -d '\n\r ' | base64 --decode > "${{ github.workspace }}/my-upload-key.jks"
          test -s "${{ github.workspace }}/my-upload-key.jks"

      - name: Run unit tests
        id: tests
        if: ${{ inputs.run_tests }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -x "./gradlew" ]; then
            ./gradlew :app:testDebugUnitTest --no-daemon
          else
            gradle :app:testDebugUnitTest --no-daemon
          fi

      - name: Build Debug APK
        if: ${{ inputs.build_debug_apk }}
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_ARGS="-PappVersionName=${{ steps.version.outputs.version }} -PappVersionCode=${{ steps.version.outputs.version_code }} --no-daemon"
          if [ -x "./gradlew" ]; then
            ./gradlew :app:assembleDebug $GRADLE_ARGS
          else
            gradle :app:assembleDebug $GRADLE_ARGS
          fi

      - name: Build Signed Release APK
        if: ${{ inputs.build_release_apk }}
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          GRADLE_ARGS="-PappVersionName=${{ steps.version.outputs.version }} -PappVersionCode=${{ steps.version.outputs.version_code }} --no-daemon"
          if [ -x "./gradlew" ]; then
            ./gradlew :app:assembleRelease $GRADLE_ARGS
          else
            gradle :app:assembleRelease $GRADLE_ARGS
          fi

      - name: Build Signed Release AAB
        if: ${{ inputs.build_release_aab }}
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          GRADLE_ARGS="-PappVersionName=${{ steps.version.outputs.version }} -PappVersionCode=${{ steps.version.outputs.version_code }} --no-daemon"
          if [ -x "./gradlew" ]; then
            ./gradlew :app:bundleRelease $GRADLE_ARGS
          else
            gradle :app:bundleRelease $GRADLE_ARGS
          fi

      - name: Collect & rename build artifacts
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          VER="${{ steps.version.outputs.version }}"

          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp "app/build/outputs/apk/debug/app-debug.apk" "dist/medi-alert-v${VER}-debug.apk"
          fi
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp "app/build/outputs/apk/release/app-release.apk" "dist/medi-alert-v${VER}-release.apk"
          fi
          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            cp "app/build/outputs/bundle/release/app-release.aab" "dist/medi-alert-v${VER}-release.aab"
          fi

          ls -lh dist/
          FILES_LIST="$(ls -1 dist | tr '\n' ' ')"
          echo "files=${FILES_LIST}" >> "$GITHUB_OUTPUT"

      - name: Clean up temporary keystore
        if: always()
        shell: bash
        run: rm -f "${{ github.workspace }}/my-upload-key.jks"

      - name: Upload workflow artifacts
        if: ${{ steps.collect.outputs.files != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: medi-alert-v${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: warn

      - name: Create & push Git tag
        if: ${{ inputs.publish_release }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Medi Alert ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: dist/*

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Medi Alert Release Build Summary"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| **Version** | \`${{ steps.version.outputs.version }}\` (versionCode: \`${{ steps.version.outputs.version_code }}\`) |"
            echo "| **Git Tag** | \`${{ steps.version.outputs.tag }}\` |"
            echo "| **Unit Tests** | ${{ inputs.run_tests && 'Ran & Passed' || 'Skipped' }} |"
            echo "| **Debug APK** | ${{ inputs.build_debug_apk }} |"
            echo "| **Release APK** | ${{ inputs.build_release_apk }} |"
            echo "| **Release AAB** | ${{ inputs.build_release_aab }} |"
            echo "| **GitHub Release** | ${{ inputs.publish_release }} |"
            echo ""
            echo "### Generated Artifacts"
            if [ -d dist ] && [ -n "$(ls -A dist 2>/dev/null)" ]; then
              for f in dist/*; do
                echo "- \`$(basename "$f")\` ($(du -h "$f" | cut -f1))"
              done
            else
              echo "- None selected"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
